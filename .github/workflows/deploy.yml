name: Deploy to GitHub Pages

# GitHub Pages only serves static files — it never runs a build. The game is a
# Vite app now, so the site has to be built here and the dist/ folder shipped.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # turns Pages on for the repo if it isn't already, so no click is
          # needed in Settings the first time
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
